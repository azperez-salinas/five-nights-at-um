server:
  port: 8080
  error:
    # RS31: respuestas de error sin informacion interna
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: librosbuysan
  datasource:
    url: jdbc:postgresql://db:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

app:
  jwt:
    # Secreto HMAC en base64 (minimo 32 bytes decodificado)
    secret: ${JWT_SECRET}
    expiration-minutes:
      comprador: 60
      dueno: 15

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    # Este resolver loguea en WARN el mensaje de Jackson ante JSON malformado,
    # que puede incluir el token invalido (por ejemplo una contrasena sin comillas).
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR
