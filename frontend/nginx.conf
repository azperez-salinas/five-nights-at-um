# OSHP (DS-88): el HTML nunca se cachea; los assets de Vite llevan hash en el
# nombre (cambian en cada build), asi que se pueden cachear sin riesgo.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-store, max-age=0";
}

server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # Anti-clickjacking: X-Frame-Options para navegadores antiguos, CSP frame-ancestors para los modernos
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # OSHP: evita que el navegador adivine el tipo MIME
    add_header X-Content-Type-Options "nosniff" always;
    # OSHP: bloquea politicas cross-domain de Flash/PDF
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # OSHP: no filtra la URL de origen a otros sitios
    add_header Referrer-Policy "no-referrer" always;
    # OSHP: aisla la ventana de popups de otros origenes
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # OSHP: otros origenes no pueden cargar nuestros recursos
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # OSHP: desactiva la resolucion DNS anticipada
    add_header X-DNS-Prefetch-Control "off" always;
    # OSHP (DS-87): la app no usa ninguna de estas APIs del navegador
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(), cross-origin-isolated=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), unload=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
    add_header Cache-Control $cache_control always;
    # OSHP (DS-86): solo recursos de otros origenes que lo autoricen (CORP/CORS)
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location / {
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
