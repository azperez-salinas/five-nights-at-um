server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # Anti-clickjacking: X-Frame-Options para navegadores antiguos, CSP frame-ancestors para los modernos
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # OSHP: evita que el navegador adivine el tipo MIME
    add_header X-Content-Type-Options "nosniff" always;
    # OSHP: bloquea politicas cross-domain de Flash/PDF
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # OSHP: no filtra la URL de origen a otros sitios
    add_header Referrer-Policy "no-referrer" always;
    # OSHP: aisla la ventana de popups de otros origenes
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # OSHP: otros origenes no pueden cargar nuestros recursos
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
